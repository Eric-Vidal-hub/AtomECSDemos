# Local wasm runs are served in the browser via wasm-server-runner:
#   cargo run --target wasm32-unknown-unknown --release --example 3d_mot
# The rustflags line is required for wasm builds with getrandom 0.3 (used by rand 0.9):
# getrandom 0.3 needs BOTH the `wasm_js` feature (see Cargo.toml) and this cfg flag.
[target.wasm32-unknown-unknown]
runner = "wasm-server-runner"
rustflags = ['--cfg', 'getrandom_backend="wasm_js"']

[env]
# wasm-server-runner's default page has no <canvas id="bevy">, which bevy 0.16
# needs (the demos set canvas: Some("#bevy")). Point it at a patched copy of
# its default index.html that adds the canvas. Relative to the repo root.
WASM_SERVER_RUNNER_CUSTOM_INDEX_HTML = "web/index.html"
